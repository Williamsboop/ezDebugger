[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezDebugger"
version = "0.1.1d"
description = "A lightweight debugging toolkit with function call tracing and logging decorators"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cameron Williams"}
]
keywords = ["debug", "logging", "decorator", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Repository = "https://github.com/Williamsboop/ezDebugger"
"Bug Tracker" = "https://github.com/Williamsboop/ezDebugger/issues"
Documentation = "https://github.com/Williamsboop/ezDebugger#readme"

[tool.setuptools]
packages = ["ezDebugger"]
package-dir = {"" = "src"}
